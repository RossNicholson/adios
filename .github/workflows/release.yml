name: Release

# Build, sign, notarize, staple, release, and bump the tap on a vX.Y.Z tag.
# Standardized to match BrewDock/ClawdBar: same 6 secrets, App Store Connect
# API-key notarization. Adios is a sandboxed Safari-extension app (not XcodeGen),
# so its build steps live inline here rather than in a shared release.sh.
#
# To release: bump the version in Xcode, commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish (create release + bump tap)? Leave off to just test build + notarize.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          sudo xcode-select -s "${XC:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Import Developer ID signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -base64 24)"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarize, publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_PUSH_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          TEAM=5HQ5V9NP82

          echo "==> Archiving (Release)"
          rm -rf build dist
          xcodebuild -project Adios.xcodeproj -scheme "Adios (macOS)" -configuration Release \
            -archivePath build/Adios.xcarchive archive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM"

          echo "==> Exporting signed app"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Adios.xcarchive \
            -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          APP="build/export/Adios.app"
          SIGN_INFO="$(codesign -dvvv "$APP" 2>&1)"
          [[ "$SIGN_INFO" == *"Authority=Developer ID Application"* ]] || { echo "ERROR: not Developer ID signed"; exit 1; }

          # Version: the tag on a push; the built app's version on a manual dry run.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          fi
          echo "==> Version $VERSION"
          DMG="dist/Adios-$VERSION.dmg"

          echo "==> Building DMG"
          mkdir -p dist dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "Adios $VERSION" -srcfolder dmg_staging -ov -format UDZO "$DMG" >/dev/null
          rm -rf dmg_staging

          echo "==> Notarizing (API key)"
          echo "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          SUBMIT="$(xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait 2>&1)"
          echo "$SUBMIT"
          [[ "$SUBMIT" == *"status: Accepted"* ]] || { echo "ERROR: notarization not Accepted"; exit 1; }

          echo "==> Stapling and verifying"
          xcrun stapler staple "$DMG"
          MP="$(hdiutil attach -nobrowse -readonly "$DMG" | grep Volumes | awk '{print $3}')"
          ASSESS="$(spctl -a -vvv -t exec "$MP/Adios.app" 2>&1 || true)"
          hdiutil detach "$MP" -quiet
          [[ "$ASSESS" == *"Notarized Developer ID"* ]] || { echo "$ASSESS"; echo "ERROR: app not notarized/accepted"; exit 1; }

          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          echo "==> Done: $DMG  sha256=$SHA"

          # Tag pushes publish; manual runs publish only if asked.
          if [[ "$GITHUB_EVENT_NAME" != "push" && "${PUBLISH_INPUT:-}" != "true" ]]; then
            echo "Dry run — not publishing."
            exit 0
          fi

          echo "==> Creating GitHub release v$VERSION"
          gh release create "v$VERSION" "$DMG" --repo RossNicholson/adios --title "v$VERSION" --generate-notes

          echo "==> Bumping Homebrew tap cask"
          git config --global user.name  "Adios Release Bot"
          git config --global user.email "actions@users.noreply.github.com"
          git clone "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/RossNicholson/homebrew-tap.git" tap
          /usr/bin/sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" tap/Casks/adios.rb
          git -C tap add Casks/adios.rb
          git -C tap commit -m "Bump adios to v$VERSION"
          git -C tap push origin main
          echo "==> Published v$VERSION"
